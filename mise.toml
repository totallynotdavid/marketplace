[tools]
bun = "1.4.3"
node = "24.22.0"

[env]
_.path = ["node_modules/.bin"]

[tasks.install]
description = "Install dependencies from bun.lock"
run = "bun install --frozen-lockfile"

[tasks.lint]
description = "Run oxlint and check formatting with oxfmt, including Markdown"
run = ["oxlint --type-aware --deny-warnings .", "oxfmt --check ."]

[tasks.fix]
description = "Apply safe oxlint fixes and format with oxfmt"
run = ["oxlint --type-aware --fix .", "oxfmt --write ."]

[tasks.typecheck]
description = "Type-check with tsc"
run = "tsc --noEmit"

[tasks.test]
description = "Run the Vitest suite in the Workers runtime against a local D1"
run = "vitest run"

[tasks.build]
description = "Build the Worker"
run = "cf build"

[tasks.check]
description = "Run lint, typecheck, test and build without writing tracked files"
depends = ["lint", "typecheck", "test", "build"]

[tasks.dev]
description = "Start the Worker with a local D1 database"
env = { CLOUDFLARE_REGISTRY_PATH = ".wrangler/registry" }
run = "cf dev --persist-to .wrangler/state"

[tasks."db:migrate:local"]
description = "Apply D1 migrations to the local database"
env = { CLOUDFLARE_REGISTRY_PATH = ".wrangler/registry" }
run = "cf d1 migrations apply 12345678-1234-4234-8234-123456789abc --local --persist-to .wrangler/state"

[tasks.deploy]
description = "Build and deploy the Worker with cf deploy"
run = "cf deploy"

[tasks.create-admin]
description = "Create the first admin in a deployed D1 database"
run = "bun scripts/create-admin.ts"
